name: Deploy CRVT to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare CRVT web app
        run: |
          rm -rf crvt site
          mkdir -p crvt site
          unzip -o CRVT_APK_CLOUD_BUILD.zip -d crvt
          python3 crvt_fixes.py
          python3 crvt_html_syntax_fix.py
          python3 crvt_pdf_fix.py
          INDEX=$(find crvt -type f -name 'index.html' | head -n 1)
          if [ -z "$INDEX" ]; then echo "index.html missing in CRVT project"; exit 1; fi
          SRC_DIR=$(dirname "$INDEX")
          cp -R "$SRC_DIR"/. site/
          if [ ! -f site/index.html ]; then echo "site/index.html missing after preparation"; exit 1; fi
          # Use the current validated CRVT index from the repository root.
          # The ZIP is still extracted first so any supporting assets remain available.
          cp index.html site/index.html
          echo "CRVT web app prepared with repository-root index.html"
          ls -la site | head -50
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
