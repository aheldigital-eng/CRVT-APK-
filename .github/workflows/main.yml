name: CRVT - Construction APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v4

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Décompresser le projet CRVT
        run: |
          rm -rf crvt
          mkdir -p crvt
          unzip -o CRVT_APK_CLOUD_BUILD.zip -d crvt

      - name: Appliquer les corrections CRVT
        run: python3 crvt_fixes.py

      - name: Activer AndroidX et Kotlin
        run: |
          printf '%s\n' \
            'android.useAndroidX=true' \
            'android.enableJetifier=true' \
            'kotlin.version=1.8.22' \
            > crvt/gradle.properties

      - name: Trouver le projet Android
        run: |
          SETTINGS=$(find crvt -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) | head -n 1)
          BUILD=$(find crvt -type f \( -name 'build.gradle' -o -name 'build.gradle.kts' \) | head -n 1)
          if [ -n "$SETTINGS" ]; then
            PROJECT_DIR=$(dirname "$SETTINGS")
          elif [ -n "$BUILD" ]; then
            PROJECT_DIR=$(dirname "$BUILD")
          else
            echo 'ERREUR : aucun projet Gradle trouvé dans le ZIP.'
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projet Android trouvé dans : $PROJECT_DIR"

      - name: Construire l'APK
        run: |
          cd "$PROJECT_DIR"
          cat > /tmp/crvt-kotlin-fix.gradle <<'EOF'
          allprojects {
            configurations.configureEach {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
            }
          }
          EOF
          gradle -I /tmp/crvt-kotlin-fix.gradle assembleDebug --no-daemon --refresh-dependencies

      - name: Vérifier l'APK
        run: find crvt -type f -name '*.apk' -print

      - name: Récupérer l'APK
        uses: actions/upload-artifact@v4
        with:
          name: CRVT-APK
          path: crvt/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
