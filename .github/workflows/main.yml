name: CRVT - Construction APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v4

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Décompresser le projet CRVT
        run: |
          rm -rf crvt
          mkdir -p crvt
          unzip -o CRVT_APK_CLOUD_BUILD.zip -d crvt

      - name: Corriger l'interface mobile CRVT
        run: |
          find crvt -type f -name 'index.html' -print0 | while IFS= read -r -d '' f; do
            sed -i 's/#quickNav{position:fixed;top:0;/#quickNav{position:fixed;top:env(safe-area-inset-top,0px);/' "$f"
            sed -i 's/body{padding-top:54px}/body{padding-top:calc(54px + env(safe-area-inset-top,0px))}/' "$f"
            sed -i 's/\.photoBtn input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}/.photoBtn{position:relative;z-index:30;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.photoBtn input{position:absolute;inset:0;width:100%;height:100%;opacity:0.01;z-index:31;cursor:pointer;pointer-events:auto}/' "$f"
            echo "Interface mobile corrigée : $f"
          done

      - name: Activer AndroidX et forcer Kotlin 1.8.22
        run: |
          printf '%s\n' \
            'android.useAndroidX=true' \
            'android.enableJetifier=true' \
            'kotlin.version=1.8.22' \
            > crvt/gradle.properties
          find crvt -type f \( -name 'build.gradle' -o -name 'build.gradle.kts' \) -print0 | while IFS= read -r -d '' f; do
            sed -i -E "s/(kotlin_version[[:space:]]*=[[:space:]]*['\"])1\.6\.21(['\"])/\1 1.8.22\2/; s/(org\.jetbrains\.kotlin:kotlin-stdlib[^:]*:)[0-9.]+/\11.8.22/g; s/(org\.jetbrains\.kotlin:kotlin-stdlib-jdk[78]:)[0-9.]+/\11.8.22/g" "$f"
          done

      - name: Trouver le projet Android
        run: |
          echo "=== CONTENU DU ZIP ==="
          find crvt -maxdepth 4 -type f | head -200
          echo "=== RECHERCHE DU PROJET ANDROID ==="
          SETTINGS=$(find crvt -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1)
          BUILD=$(find crvt -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) | head -n 1)
          GRADLEW=$(find crvt -type f -name "gradlew" | head -n 1)
          echo "settings.gradle : $SETTINGS"
          echo "build.gradle    : $BUILD"
          echo "gradlew         : $GRADLEW"
          if [ -n "$SETTINGS" ]; then
            PROJECT_DIR=$(dirname "$SETTINGS")
          elif [ -n "$BUILD" ]; then
            PROJECT_DIR=$(dirname "$BUILD")
          else
            echo "ERREUR : aucun projet Gradle trouvé dans le ZIP."
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projet Android trouvé dans : $PROJECT_DIR"

      - name: Construire l'APK
        run: |
          cd "$PROJECT_DIR"
          echo "Construction depuis : $(pwd)"
          GRADLEW=$(find . -maxdepth 2 -type f -name "gradlew" | head -n 1)
          if [ -n "$GRADLEW" ]; then
            chmod +x "$GRADLEW"
            "$GRADLEW" assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Vérifier l'APK
        run: |
          echo "=== APK PRODUITS ==="
          find crvt -type f -name "*.apk" -print

      - name: Récupérer l'APK
        uses: actions/upload-artifact@v4
        with:
          name: CRVT-APK
          path: |
            crvt/**/build/outputs/apk/**/*.apk
          if-no-files-found: error