name: CRVT - Construction APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v4

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Décompresser le projet CRVT
        run: |
          rm -rf crvt
          mkdir -p crvt
          unzip -o CRVT_APK_CLOUD_BUILD.zip -d crvt

      - name: Activer AndroidX et préparer Kotlin
        run: |
          printf '%s\n' \
            'android.useAndroidX=true' \
            'android.enableJetifier=true' \
            > crvt/gradle.properties

          cat > crvt/crvt-kotlin-fix.gradle <<'EOF'
          allprojects {
            configurations.configureEach {
              resolutionStrategy.eachDependency { details ->
                if (details.requested.group == 'org.jetbrains.kotlin') {
                  details.useVersion('1.8.22')
                  details.because('Uniformiser les dépendances Kotlin pour éviter les classes dupliquées')
                }
              }
            }
          }
          EOF

      - name: Trouver le projet Android
        run: |
          echo "=== CONTENU DU ZIP ==="
          find crvt -maxdepth 4 -type f | head -200

          SETTINGS=$(find crvt -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1)
          BUILD=$(find crvt -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) | head -n 1)

          if [ -n "$SETTINGS" ]; then
            PROJECT_DIR=$(dirname "$SETTINGS")
          elif [ -n "$BUILD" ]; then
            PROJECT_DIR=$(dirname "$BUILD")
          else
            echo "ERREUR : aucun projet Gradle trouvé dans le ZIP."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projet Android trouvé dans : $PROJECT_DIR"

      - name: Construire l'APK
        run: |
          cd "$PROJECT_DIR"
          echo "Construction depuis : $(pwd)"

          GRADLEW=$(find . -maxdepth 2 -type f -name "gradlew" | head -n 1)

          if [ -n "$GRADLEW" ]; then
            chmod +x "$GRADLEW"
            "$GRADLEW" -I crvt-kotlin-fix.gradle assembleDebug --no-daemon --stacktrace
          else
            gradle -I crvt-kotlin-fix.gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Vérifier l'APK
        run: |
          echo "=== APK PRODUITS ==="
          find crvt -type f -name "*.apk" -print

      - name: Récupérer l'APK
        uses: actions/upload-artifact@v4
        with:
          name: CRVT-APK
          path: |
            crvt/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
