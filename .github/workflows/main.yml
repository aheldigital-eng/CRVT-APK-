name: CRVT - Construction APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v4

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Décompresser le projet CRVT
        run: |
          rm -rf crvt
          mkdir -p crvt
          unzip -o CRVT_APK_CLOUD_BUILD.zip -d crvt

      - name: Corriger le sélecteur photo Android natif
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crvt/app/src/main/java/fr/crvt/app/MainActivity.java')
          s = p.read_text()
          s = s.replace('import android.app.Activity;\n', 'import android.app.Activity;\nimport android.content.ActivityNotFoundException;\nimport android.content.Intent;\nimport android.net.Uri;\n')
          s = s.replace('import android.webkit.WebChromeClient;\n', 'import android.webkit.WebChromeClient;\nimport android.webkit.ValueCallback;\n')
          s = s.replace('    private static final int CAMERA_REQUEST = 1001;\n', '    private static final int CAMERA_REQUEST = 1001;\n    private static final int FILE_CHOOSER_REQUEST = 1002;\n    private ValueCallback<Uri[]> filePathCallback;\n')
          old = '        webView.setWebChromeClient(new WebChromeClient());'
          new = '''        webView.setWebChromeClient(new WebChromeClient() {\n            @Override\n            public boolean onShowFileChooser(WebView view, ValueCallback<Uri[]> callback, FileChooserParams params) {\n                if (filePathCallback != null) {\n                    filePathCallback.onReceiveValue(null);\n                }\n                filePathCallback = callback;\n                try {\n                    Intent intent = params.createIntent();\n                    startActivityForResult(intent, FILE_CHOOSER_REQUEST);\n                    return true;\n                } catch (ActivityNotFoundException e) {\n                    filePathCallback = null;\n                    return false;\n                }\n            }\n        });'''
          if old not in s:
              raise SystemExit('WebChromeClient target introuvable')
          s = s.replace(old, new)
          marker = '    @Override\n    public void onBackPressed() {'
          result = '''    @Override\n    protected void onActivityResult(int requestCode, int resultCode, Intent data) {\n        super.onActivityResult(requestCode, resultCode, data);\n        if (requestCode == FILE_CHOOSER_REQUEST) {\n            if (filePathCallback == null) return;\n            Uri[] results = null;\n            if (resultCode == RESULT_OK && data != null) {\n                if (data.getData() != null) {\n                    results = new Uri[]{data.getData()};\n                } else if (data.getClipData() != null) {\n                    int count = data.getClipData().getItemCount();\n                    results = new Uri[count];\n                    for (int i = 0; i < count; i++) {\n                        results[i] = data.getClipData().getItemAt(i).getUri();\n                    }\n                }\n            }\n            filePathCallback.onReceiveValue(results);\n            filePathCallback = null;\n        }\n    }\n\n'''
          if marker not in s:
              raise SystemExit('onBackPressed target introuvable')
          s = s.replace(marker, result + marker)
          p.write_text(s)
          print('Sélecteur photo Android natif corrigé.')
          PY

      - name: Corriger les boutons photo CRVT
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for path in Path('crvt').rglob('index.html'):
              s = path.read_text()
              s = s.replace('''<label class="btn primary photoBtn">📷 Prendre une photo\n    <input type="file" accept="image/*" capture="environment" data-photo="${sec}">\n  </label>\n  <label class="btn secondary photoBtn">🖼️ Choisir dans la galerie\n    <input type="file" accept="image/*" data-photo="${sec}">\n  </label>''', '''<button type="button" class="btn primary photoBtn" onclick="choosePhoto('${sec}',true)">📷 Prendre une photo</button>\n  <button type="button" class="btn secondary photoBtn" onclick="choosePhoto('${sec}',false)">🖼️ Choisir dans la galerie</button>''')
              anchor = 'function bindPhotoInputs(){'
              helper = '''function choosePhoto(sec,camera){\n  const input=document.createElement('input');\n  input.type='file';\n  input.accept='image/*';\n  if(camera) input.setAttribute('capture','environment');\n  input.style.position='fixed';\n  input.style.left='-9999px';\n  input.style.width='1px';\n  input.style.height='1px';\n  input.onchange=()=>{if(input.files && input.files[0]) addPhoto(input.files[0],sec); input.remove();};\n  document.body.appendChild(input);\n  input.click();\n}\n\n'''
              if anchor in s and 'function choosePhoto(sec,camera)' not in s:
                  s = s.replace(anchor, helper + anchor, 1)
              s = s.replace('''.photoBtn{position:relative;overflow:hidden;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}.photoBtn{position:relative;z-index:30;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.photoBtn input{position:absolute;inset:0;width:100%;height:100%;opacity:0.01;z-index:31;cursor:pointer;pointer-events:auto}''', '''.photoBtn{position:relative;z-index:30;touch-action:manipulation;-webkit-tap-highlight-color:transparent;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}''')
              s = s.replace('''#quickNav{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:250;''', '''#quickNav{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:120;''')
              path.write_text(s)
              print('Boutons photo corrigés :', path)
          PY

      - name: Améliorer les annotations et le rapport mobile
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for path in Path('crvt').rglob('index.html'):
              s = path.read_text()
              old = '.modal{position:fixed;inset:0;background:#000d;z-index:100;padding:8px}.modalbox{height:100%;display:flex;flex-direction:column;gap:8px}.canvaswrap{'
              new = '.modal{position:fixed;inset:0;background:#000d;z-index:1000;padding:8px;overflow:hidden}.modalbox{height:100%;display:flex;flex-direction:column;gap:8px;min-height:0}.tools{max-height:42vh;overflow-y:auto;flex:0 0 auto;padding:8px;background:#f8fafc;border-radius:12px;border:1px solid #cbd5e1;align-content:flex-start;overscroll-behavior:contain}.canvaswrap{'
              if old in s:
                  s = s.replace(old,new,1)
              else:
                  print('Avertissement: CSS modal cible absente:',path)
              old = '.tools{display:flex;gap:6px;flex-wrap:wrap}.tools .btn{flex:none}'
              new = '.tools{display:flex;gap:6px;flex-wrap:wrap}.tools .btn{flex:none}.tools select{flex:none;min-height:42px}.tools .btn.active{outline:3px solid #0b6e9e;outline-offset:1px}.tools::-webkit-scrollbar{width:8px}.tools::-webkit-scrollbar-thumb{background:#94a3b8;border-radius:8px}'
              if old in s:
                  s = s.replace(old,new,1)
              old = 'let w=openWindow?window.open("","_blank"):null;\nif(openWindow && !w){toast("Autorise les fenêtres pop-up pour générer le rapport");return null}'
              new = 'let w=openWindow?window.open("","_blank"):null;\nif(openWindow && !w){ w=window; }'
              if old in s:
                  s = s.replace(old,new,1)
              else:
                  print('Avertissement: fallback rapport déjà différent:',path)
              old = '<body>${pages.join("")}<button id="printBtn" disabled>🖨️ Imprimer / Enregistrer en PDF</button>'
              new = '<body>${pages.join("")}<button id="backCrvtBtn" onclick="location.reload()">↩ Retour à CRVT</button><button id="printBtn" disabled>🖨️ Imprimer / Enregistrer en PDF</button>'
              if old in s:
                  s = s.replace(old,new,1)
              old = 'button:disabled{opacity:.55;cursor:wait}'
              new = '#backCrvtBtn{left:18px;right:auto;background:#fff;color:#0b6e9e;border:1px solid #94a3b8}button:disabled{opacity:.55;cursor:wait}'
              if old in s:
                  s = s.replace(old,new,1)
              path.write_text(s)
              print('Annotations + rapport mobile corrigés :',path)
          PY

      - name: Activer AndroidX et corriger Kotlin
        run: |
          printf '%s\n' \
            'android.useAndroidX=true' \
            'android.enableJetifier=true' \
            'kotlin.version=1.8.22' \
            > crvt/gradle.properties

      - name: Trouver le projet Android
        run: |
          SETTINGS=$(find crvt -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1)
          BUILD=$(find crvt -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) | head -n 1)
          if [ -n "$SETTINGS" ]; then
            PROJECT_DIR=$(dirname "$SETTINGS")
          elif [ -n "$BUILD" ]; then
            PROJECT_DIR=$(dirname "$BUILD")
          else
            echo "ERREUR : aucun projet Gradle trouvé dans le ZIP."
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projet Android trouvé dans : $PROJECT_DIR"

      - name: Construire l'APK
        run: |
          cd "$PROJECT_DIR"
          cat > /tmp/crvt-kotlin-fix.gradle <<'EOF'
          allprojects {
            configurations.configureEach {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
            }
          }
          EOF
          gradle -I /tmp/crvt-kotlin-fix.gradle assembleDebug --no-daemon --refresh-dependencies

      - name: Vérifier l'APK
        run: |
          echo "=== APK PRODUITS ==="
          find crvt -type f -name "*.apk" -print

      - name: Récupérer l'APK
        uses: actions/upload-artifact@v4
        with:
          name: CRVT-APK
          path: |
            crvt/**/build/outputs/apk/**/*.apk
          if-no-files-found: error