name: CRVT - Construction APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v4

      - name: Décompresser le projet CRVT
        run: |
          mkdir -p crvt
          unzip -o CRVT_APK_CLOUD_BUILD.zip -d crvt

      - name: Trouver le projet Android
        run: |
          echo "Recherche du projet Android..."
          find crvt -name "gradlew" -o -name "settings.gradle" -o -name "settings.gradle.kts"

      - name: Construire l'APK
        run: |
          GRADLEW=$(find crvt -name "gradlew" | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "ERREUR : gradlew introuvable dans le projet."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")
          cd "$PROJECT_DIR"

          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Récupérer l'APK
        uses: actions/upload-artifact@v4
        with:
          name: CRVT-APK
          path: |
            crvt/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
